          - Cap. 02 - Regime Jurídico (LGPD, LAI e MCI): livro/parte_1_fundamentos_e_regime_juridico/cap_02_regime_juridico_lgpd_lai_marco_civil.md
          - Cap. 03 - Investigação Defensiva (Prov. 188): livro/parte_1_fundamentos_e_regime_juridico/cap_03_investigacao_defensiva_provimento_188.md
